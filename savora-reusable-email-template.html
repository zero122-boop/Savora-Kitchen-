<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>Savora Kitchen</title>
</head>
<body style="margin:0; padding:0; background-color:#F8F4EC; color:#0F172A; font-family:Arial, Helvetica, sans-serif;">
  <!-- Set the EmailJS Subject field to {{email_subject}}. -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F8F4EC" style="width:100%; margin:0; padding:0; background-color:#F8F4EC;">
    <tr>
      <td align="center" style="padding:32px 14px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px; border-collapse:separate; border-spacing:0;">
          <tr>
            <td bgcolor="#0F172A" style="padding:28px 32px; background-color:#0F172A; border-radius:16px 16px 0 0; text-align:center;">
              <p style="margin:0; color:#B08D57; font-family:Georgia, 'Times New Roman', serif; font-size:23px; font-weight:bold; letter-spacing:1px;">SAVORA <span style="color:#F8F4EC;">KITCHEN</span></p>
              <p style="margin:8px 0 0; color:#F8F4EC; font-size:11px; letter-spacing:2px; text-transform:uppercase;">A world of flavor, served with care</p>
            </td>
          </tr>
          <tr>
            <td bgcolor="#FFFFFF" style="padding:36px 38px 34px; background-color:#FFFFFF; border:1px solid #e8e1d6; border-top:0; border-radius:0;">
              <p style="margin:0 0 18px; color:#0F172A; font-size:16px; line-height:1.6;">Hello {{name}},</p>
              <h1 style="margin:0 0 16px; color:#0F172A; font-family:Georgia, 'Times New Roman', serif; font-size:28px; font-weight:normal; line-height:1.25;">{{email_heading}}</h1>
              <p style="margin:0 0 24px; color:#475569; font-size:15px; line-height:1.75;">{{email_message}}</p>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F8F4EC" style="width:100%; background-color:#F8F4EC; border:1px solid #e8e1d6; border-left:4px solid #C76B2A; border-radius:10px;">
                <tr>
                  <td style="padding:19px 21px;">
                    <p style="margin:0 0 10px; color:#B08D57; font-size:11px; font-weight:bold; letter-spacing:1.5px; text-transform:uppercase;">Your Details</p>
                    <pre style="margin:0; color:#0F172A; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word;">{{details_text}}</pre>
                  </td>
                </tr>
              </table>

              <p style="margin:26px 0 0; color:#475569; font-size:15px; line-height:1.7;">Warm regards,<br><strong style="color:#0F172A;">The Savora Kitchen Team</strong></p>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#0F172A" style="padding:20px 24px; background-color:#0F172A; border-radius:0 0 16px 16px;">
              <p style="margin:0; color:#F8F4EC; font-family:Georgia, 'Times New Roman', serif; font-size:15px;">Savora Kitchen</p>
              <p style="margin:7px 0 0; color:#cbd5e1; font-size:12px; line-height:1.6;">Thank you for choosing us. We look forward to serving you.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
