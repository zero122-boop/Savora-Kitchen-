<!--Background Video Overlay-->
<div class="video-background-wrapper">
    <video autoplay muted loop playsinline class="video-background">
        <source src="Savora Kitchen.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
</div>

<!--Main Order Cardd Section-->
<section class="order-modal-section">
    <div class="order-card-container">

        <!--Left Side: Interactive Form-->
        <div class="order-form-side">
            <span class="brand-tag">Savora Direct</span>
            <h2>Order Your Experience</h2>

        <form class="order-form" method="post">
            <!-- Delivery / Pick-up Toggle -->
            <div class="order-type-toggle">
                <input type="radio" id="delivery" name="order-type" value="delivery" checked>
                <label for="delivery">Delivery</label>

                <input type="radio" id="pickup" name="order-type" value="pickup">
                <label for="pickup">Pickup</label>
            </div>
            <!-- Customer Info -->
            <div class="form-group">
                <label for="order-name">Full Name</label>
            <input type="text" id="order-name" name="name" placeholder="Enter your full name" maxlength="200" required>
            </div>

        <div class="form-group">
            <label for="order-email">Email Address</label>
            <input type="email" id="order-email" name="email" placeholder="name@example.com" autocomplete="email" maxlength="254" required>
        </div>
        <!-- Food Selection -->
        <div class="form-row">
            <div class="form-group flex-grow">
                <label for="food-selection">Select Signature Dish</label>
                <select id="food-selection" name="dish" required>
                    <option value="" disabled selected>Choose a delicacy...</option>
                    <option value="Ramen">Ramen</option>
                    <option value="Sushi Deluxe">Sushi Deluxe</option>
                    <option value="Thai Green Curry">Thai Green Curry</option>
                    <option value="Korean Bibimbap">Korean Bibimbap</option>
                    <option value="Truffle Fettuccine Alfredo">Truffle Fettuccine Alfredo</option>
                    <option value="Margherita Pizza">Margherita Pizza</option>
                    <option value="Lasagna">Lasagna</option>
                </select>
            </div>
        </div>
    <div class="form-group qty-group">
        <label for="order-qty">Qty</label>
        <input type="number" id="order-qty" name="quantity" min="1" max="10" step="1" value="1" required>
    </div>

    <div class="order-price-preview" id="order-price-preview" aria-live="polite" hidden>
        <p class="order-price-line"></p>
        <p class="order-price-total"></p>
    </div>

    <!-- Delivery Address -->
    <div class="form-group" id="address-group">
        <label for="delivery-address">Delivery Address</label>
        <input type="text" id="delivery-address" name="address" placeholder="Street address, apartment, city" maxlength="500" required>
    </div>
<div class="form-group" id="pickup-time-group">
    <label for="pickup-time">Pickup Time</label>
    <input type="time" id="pickup-time" name="pickup_time">
</div>

    <button type="submit" class="submit-btn">Place Order</button>
    <p class="login-status order-status" role="status" aria-live="polite"></p>
    </form>
        </div>
    <!-- Right Side: Culinary Showcase Image -->
        <div class="order-image-side">
            <img src="Sushi Deluxe.png" alt="Savora Signature Dish" class="showcase-img">
            <div class="image-overlay-content">
                <p class="image-caption">Crafted Fresh By Our Executive Chefs</p>
            </div>
        </div>
        </div>
</section>
